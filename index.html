<meta name="description" content="СТАЛЕВИЙ РЕЙД — 8-бітний run-and-gun: 10 етапів, боси, FPV-дрони. Працює офлайн.">
<title>СТАЛЕВИЙ РЕЙД — 8 біт</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07080c;color:#c8d2e4;
  font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none;color-scheme:dark only}
#app{display:flex;flex-direction:column;height:100dvh;max-width:780px;margin:0 auto}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px 2px}
#bar .t{flex:1;color:#4d5a72;font-weight:700;font-size:12px;letter-spacing:.14em}
.chip{background:#131824;border:1px solid #222a3a;color:#93a4c2;border-radius:999px;
  padding:6px 11px;font:700 11px/1 inherit;letter-spacing:.09em;cursor:pointer}
.chip.on{background:#16261a;border-color:#3a6c2c;color:#8ee06a}
#screen{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 8px}
canvas{max-width:100%;max-height:100%;image-rendering:pixelated;background:#000;
  border-radius:3px;box-shadow:0 0 0 1px #1b2231,0 12px 34px #000c}
#deck{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 18px;gap:10px}
#pad{width:142px;height:142px;border-radius:50%;background:#101521;border:1px solid #222a3a;
  position:relative;flex:none;touch-action:none}
#pad .cx,#pad .cy{position:absolute;background:#1a2130;border-radius:3px}
#pad .cx{left:16px;right:16px;top:50%;height:12px;margin-top:-6px}
#pad .cy{top:16px;bottom:16px;left:50%;width:12px;margin-left:-6px}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;left:45px;top:45px;background:#28324a;
  border:1px solid #3a465f;pointer-events:none;transition:transform .04s linear}
#btns{display:flex;gap:14px;align-items:center}
.btn{width:80px;height:80px;border-radius:50%;border:none;color:#fff;
  font:700 12px/1.2 inherit;letter-spacing:.06em;touch-action:none;flex:none}
#bFire{background:#ab1f28;box-shadow:inset 0 -4px 0 #6d1219}
#bJump{background:#1d59b4;box-shadow:inset 0 -4px 0 #113470;width:70px;height:70px}
.btn:active{filter:brightness(1.4)}
#hint{text-align:center;font-size:11px;color:#465268;padding:0 12px 10px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="t">СТАЛЕВИЙ РЕЙД</div>
    <button class="chip" id="cPause">ПАУЗА</button>
  </div>
  <div id="screen"><canvas id="c"></canvas></div>
  <div id="deck">
    <div id="pad"><div class="cx"></div><div class="cy"></div><div id="knob"></div></div>
    <div id="btns">
      <button class="btn" id="bJump">СТРИБОК</button>
      <button class="btn" id="bFire">ВОГОНЬ</button>
    </div>
  </div>
  <div id="hint">Клавіатура: стрілки — рух і приціл, Z або пробіл — вогонь, X — стрибок, P — пауза. Звук і решта — у меню паузи.</div>
</div>

var IMG={}, imgReady=0, imgTotal=0;
for(var _k in IMGSRC){ imgTotal++; (function(k){ var im=new Image();
  im.onload=function(){ imgReady++; }; im.src=IMGSRC[k]; IMG[k]=im; })(_k); }
function IOK(k){ var i=IMG[k]; return !!(i && i.complete && i.naturalWidth>0); }
function SPR(k,x,y,w,h,flip){
  var i=IMG[k]; if(!(i&&i.complete&&i.naturalWidth>0)) return false;
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  if(flip){ g.save(); g.translate(x+w,y); g.scale(-1,1); g.drawImage(i,0,0,w,h); g.restore(); }
  else g.drawImage(i,x,y,w,h);
  return true;
}
function SPRH(k,cx,footY,h,flip,frac){
  var i=IMG[k]; if(!(i&&i.complete&&i.naturalWidth>0)) return false;
  var w=Math.max(1,Math.round(i.naturalWidth*h/i.naturalHeight));
  frac=(frac===undefined)?0.40:frac;
  var x=cx-(flip? w*(1-frac) : w*frac);
  return SPR(k,x,footY-h,w,h,flip);
}
function TILEBG(k,par,bottomY,h){
  var i=IMG[k]; if(!(i&&i.complete&&i.naturalWidth>0)) return false;
  var tw=Math.max(1,Math.round(i.naturalWidth*h/i.naturalHeight));
  var off=((camX*par)%tw+tw)%tw;
  for(var x=-off;x<VW+tw;x+=tw) g.drawImage(i,Math.round(x),Math.round(bottomY-h),tw,Math.round(h));
  return true;
}
function TILEWALL(k,par,yTop,yBot,h){
  for(var yy=yBot; yy>yTop; yy-=h) if(!TILEBG(k,par,yy,h)) return false;
  return true;
}
function TILEGR(k,s,topY,h){
  var i=IMG[k]; if(!(i&&i.complete&&i.naturalWidth>0)) return false;
  var nw=i.naturalWidth, nh=i.naturalHeight;
  var tw=Math.max(2,Math.round(nw*h/nh));
  var wx0=Math.max(s.x,camX-tw), wx1=Math.min(s.x+s.w,camX+VW+tw);
  if(wx1<=wx0) return true;
  var t=Math.floor((wx0-s.x)/tw);
  for(;;t++){
    var wx=s.x+t*tw; if(wx>=wx1) break;
    var c0=Math.max(0,wx0-wx), c1=Math.min(tw,wx1-wx);
    if(c1<=c0) continue;
    var sx=Math.round(c0*nw/tw), sw=Math.max(1,Math.round((c1-c0)*nw/tw));
    g.drawImage(i,sx,0,sw,nh,Math.round(wx-camX+c0),Math.round(topY),Math.round(c1-c0),Math.round(h));
  }
  return true;
}

var AC=null, sndOn=true, musOn=true;
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
function tone(f1,f2,dur,type,vol){
  if(!sndOn) return; var a=actx(); if(!a) return;
  var o=a.createOscillator(), gn=a.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f1,a.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),a.currentTime+dur);
  gn.gain.setValueAtTime(vol||0.06,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
var noiseBuf=null;
function noise(dur,vol,filt){
  if(!sndOn) return; var a=actx(); if(!a) return;
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  var s=a.createBufferSource(); s.buffer=noiseBuf;
  var bp=a.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=filt||900;
  var gn=a.createGain(); gn.gain.setValueAtTime(vol||0.14,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  s.connect(bp); bp.connect(gn); gn.connect(a.destination); s.start(); s.stop(a.currentTime+dur);
}

var musStep=0, musRoot=[55,49,46];
function music(idx){
  if(!musOn||!sndOn) return;
  var tr=bossOn?BOSSTR:TRACKS[idx%TRACKS.length];
  var st=musStep%16; musStep++;
  var root=bossOn?41:musRoot[idx%musRoot.length];
  var bf=root*Math.pow(2,tr.bass[st]/12);
  tone(bf,bf,0.13,'triangle',bossOn?0.05:0.04);
  if(st%2===0){
    var lf=root*2*Math.pow(2,tr.lead[st]/12);
    tone(lf,lf,0.09,'square',bossOn?0.026:0.02);
  }
  if(tr.hat[st]) noise(0.035,bossOn?0.05:0.035,4200);

var pad=document.getElementById('pad'), knob=document.getElementById('knob');
var padId=null;
function padAt(ev){
  var r=pad.getBoundingClientRect();
  var dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
  var d=Math.sqrt(dx*dx+dy*dy), dz=16;
  setIn('l',0);setIn('r',0);setIn('u',0);setIn('d',0);
  if(d>dz){
    var nx=dx/d, ny=dy/d;
    if(nx<-0.38) setIn('l',1); if(nx>0.38) setIn('r',1);
    if(ny<-0.38) setIn('u',1); if(ny>0.38) setIn('d',1);
  }
  var m=Math.min(d,34), a=Math.atan2(dy,dx);
  knob.style.transform='translate('+(Math.cos(a)*m).toFixed(1)+'px,'+(Math.sin(a)*m).toFixed(1)+'px)';
}
pad.addEventListener('pointerdown',function(e){ padId=e.pointerId; pad.setPointerCapture(e.pointerId); padAt(e); e.preventDefault(); });
pad.addEventListener('pointermove',function(e){ if(e.pointerId===padId) padAt(e); });
function padUp(e){ if(e.pointerId!==padId) return; padId=null;

  L.solids=L.grounds.slice();
  S0.solids.forEach(function(b){ L.solids.push({x:b[0],y:b[1],w:b[2],h:b[3],crate:1,hp:6,fl:0}); });
  L.oneway=S0.plats.map(function(p){ return {x:p[0],y:p[1],w:p[2],h:p[3]}; });
  L.auto=S0.auto||0; L.tint=S0.tint||null; L.tintA=S0.tintA||0;
  L.spawns=S0.spawns.filter(function(sp,i){ return sp[0]>240 && (!DF.thin || (i%DF.thin!==2)); })
                     .map(function(s){ return {x:s[0],t:s[1],y:s[2]||0,done:0}; });
  L.pods=S0.pods.map(function(x){ return {x:x,done:0}; });
  L.cover=(S0.cover||[]).map(function(x){
    var gyv=0; for(var i=0;i<L.grounds.length;i++){ var sg=L.grounds[i];
      if(x>=sg.x&&x<sg.x+sg.w){ gyv=sg.y; break; } }
    if(!gyv) gyv=L.gy;
    return {x:x,y:gyv-24,w:34,h:24,sway:0};
  });

function boom(x,y,n,col,sp){
  explo.push({x:x,y:y,t:0,r:(n>=10?18:10),big:n>=10});
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=Math.random()*(sp||2)+0.4;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.4,t:0,life:18+Math.random()*16,
      c:col||['#fcfcfc','#fc9838','#d82800'][(Math.random()*3)|0]});
  }
}
function popup(t){ msg=t; msgT=90; }
function nextWeapon(){
  if(!wbag.length){
    wbag=['M','S','L','F'];
    for(var i=wbag.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=wbag[i]; wbag[i]=wbag[j]; wbag[j]=t; }
  }
  var w=wbag.shift();
  if(w===weapon && wbag.length){ wbag.push(w); w=wbag.shift(); }
  return w;
}
function stageStats(){
  var tm=(frame-stageT0)/60, acc=shots?hits/shots:0;
  var pt=0;
  pt+=(tm<=95)?2:((tm<=130)?1:0);
  pt+=(acc>=0.34)?2:((acc>=0.20)?1:0);
  pt+=(stageDeaths===0)?2:((stageDeaths<=1)?1:0);
  return {t:tm,acc:acc,d:stageDeaths,r:(pt>=6)?'S':((pt>=4)?'A':((pt>=2)?'B':'C'))};
}
function splash(x,y){
  var c=(lvl.theme==='jungle')?'#7cc0f0':(lvl.theme==='base'?'#38d8fc':'#fc9838');
  for(var i=0;i<6;i++) parts.push({x:x,y:y,vx:(Math.random()-0.5)*1.4,vy:-Math.random()*1.6-0.4,t:0,life:16,c:c});
  SFX.clang();
}

function aimVec(){
  var d=player.face, ax=d, ay=0;
  if(player.prone) return {x:d,y:0,lo:1};
  if(IN.u && !IN.l && !IN.r){ ax=0; ay=-1; }
  else if(IN.u){ ax=d*0.707; ay=-0.707; }
  else if(IN.d && !player.grounded && !IN.l && !IN.r){ ax=0; ay=1; }
  else if(IN.d && !player.grounded){ ax=d*0.707; ay=0.707; }
  return {x:ax,y:ay,lo:0};
}
function shoot(){
  var w=WP[weapon]; if(player.cd>0||pb.length>=w.max) return;
  player.cd=w.cd;
  var a=aimVec();
  player.mz=4; player.mzx=a.x; player.mzy=a.y; player.mzlo=a.lo;
  shots++; player.loud=14;
  if(weapon==='M'){ shakeIt(0.7); player.vx-=a.x*0.55; }
  else if(weapon==='S'){ shakeIt(0.5); player.vx-=a.x*0.35; }
  else if(weapon==='L'){ shakeIt(0.5); }
  var sx=player.x+player.w/2+a.x*7, sy=player.y+(a.lo?5:7)+a.y*5;
  function mk(vx,vy,big){ pb.push({x:sx,y:sy,vx:vx,vy:vy,w:big?4:3,h:big?4:2,dmg:w.dmg,
    col:w.col,kind:weapon,t:0,pierce:weapon==='L'}); }
  if(weapon==='S'){
    for(var i=-2;i<=2;i++){ var an=Math.atan2(a.y,a.x)+i*0.26;
      mk(Math.cos(an)*w.sp,Math.sin(an)*w.sp,false); }
    SFX.shot();
  } else if(weapon==='L'){
    var vert=Math.abs(a.y)>Math.abs(a.x)*1.5;
    var bw=vert?3:10, bh=vert?10:3;
    pb.push({x:sx-bw/2,y:sy-bh/2,vx:a.x*w.sp,vy:a.y*w.sp,w:bw,h:bh,dmg:w.dmg,col:w.col,kind:'L',t:0,
      pierce:true,ax:a.x,ay:a.y});
    SFX.laser();
  } else if(weapon==='F'){
    mk(a.x*w.sp,a.y*w.sp,true); pb[pb.length-1].wob=Math.random()*6.28; SFX.shot();
  } else { mk(a.x*w.sp,a.y*w.sp,false); SFX.shot(); }
}
function eShot(x,y,tx,ty,sp,col){
  if(eb.length>=DF.maxeb) return;
  sp=sp*DF.eb;
  var dx=tx-x, dy=ty-y;
  var a=Math.atan2(dy,dx)+(Math.random()*2-1)*(DF.aim||0);
  eb.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:4,h:4,col:col||'#fc5454',t:0});
}
function eRadial(x,y,n,sp,off){
  sp=sp*DF.eb;
  for(var i=0;i<n;i++){ var a=off+i*(Math.PI*2/n);
    eb.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:4,h:4,col:'#fc84fc',t:0}); }
}

function spawnFPV(){

}
function spawnFoe(t,x,y){
  var gy=groundYAt(x); if(gy<-100) gy=lvl.gy;
  if(t==='sold') foes.push({t:t,x:x,y:gy-18,w:10,h:18,hp:1,vx:0,vy:0,st:0,tm:(Math.random()*60)|0,face:-1,anim:0,sc:100,grace:55});
  if(t==='run') foes.push({t:t,x:x,y:gy-18,w:10,h:18,hp:1,vx:0,vy:0,st:0,tm:0,face:-1,anim:0,sc:150});
  if(t==='turret') foes.push({t:t,x:x,y:gy-14,w:16,h:14,hp:5,tm:(Math.random()*80)|0,st:0,sc:300});
  if(t==='ceil') foes.push({t:t,x:x,y:30,w:16,h:14,hp:5,tm:(Math.random()*80)|0,st:0,sc:300});
  if(t==='drone'){
    var alv=0; for(var q=0;q<foes.length;q++) if(foes[q].t==='drone') alv++;

function foeDie(f,bx,by){

  var big=(f.t==='turret'||f.t==='ceil'||f.t==='bunker'||f.t==='drone'||f.t==='fpv');

function addScore(n){ var b=Math.floor(score/20000); score+=Math.round(n*mult); if(Math.floor(score/20000)>b){ lives++; SFX.pick(); popup('ДОДАТКОВЕ ЖИТТЯ'); } if(score>best) best=score; }
function shakeIt(n){ shake=n; }

function updFoes(){
  var px=player.x+player.w/2, py=player.y+player.h/2;
  for(var i=foes.length-1;i>=0;i--){
    var f=foes[i];
    if(f.t==='drone'&&(f.x<camX-260||f.x>camX+VW+300)){ foes.splice(i,1); continue; }
    if(f.t==='sold'||f.t==='run'){
      var dir=(px<f.x+f.w/2)?-1:1;
      if(f.faceT>0) f.faceT--;
      else if(dir!==f.face){ f.face=dir; f.faceT=9; }
      f.vy+=0.3; if(f.vy>6) f.vy=6;
      var sp=((f.t==='run')?0.95:0.55)*DF.world;
      if(f.t==='sold'){
        f.tm++;
        if(f.st===0){
          var dist=Math.abs(px-(f.x+f.w/2));
          f.step=(f.step||((f.x|0)%80))+1;
          var walking=(f.step%84)<54;
          var mv=(dist>36&&walking)?dir:0;
          var ah=groundYAt(f.x+(mv||dir)*10);
          if(mv&&ah>-100){ f.x+=mv*sp; f.anim+=sp; } else f.anim+=0.22;
          if(f.grace>0) f.grace--;
          if(f.tm>(90+((f.x|0)%60))*DF.rate && f.grace<=0 && !player.hidden && !calm && f.x<camX+VW-6 && f.x>camX-10){ f.st=1; f.tm=0; }
        } else {
          if(f.tm===18){ eShot(f.x+f.w/2+dir*5,f.y+6,px,py,1.5); SFX.clang(); }
          if(f.tm>50){ f.st=0; f.tm=0; }
        }
      } else {
        var ah2=groundYAt(f.x+dir*10);
        if(ah2<-100 && f.grounded) f.vy=-4.6;
        f.tm++;
        var acc=Math.min(1,f.tm/22);
        f.x+=dir*sp*(0.55+0.45*acc); f.anim+=sp*(0.6+0.4*acc);
      }
      f.py=f.y; f.y+=f.vy; f.grounded=0;
      for(var s=0;s<lvl.solids.length;s++){ var so=lvl.solids[s];
        if(hit(f.x,f.y,f.w,f.h,so.x,so.y,so.w,so.h)){
          if(f.vy>0){ f.y=so.y-f.h; f.vy=0; f.grounded=1; } else if(f.vy<0){ f.y=so.y+so.h; f.vy=0; } } }
      if(f.y>VH+40){ foes.splice(i,1); continue; }
    }
    else if(f.t==='turret'||f.t==='ceil'){
      f.tm++;
      var tdx=px-(f.x+f.w/2), tdy=py-(f.y+f.h/2), td=Math.sqrt(tdx*tdx+tdy*tdy)||1;
      if(f.ax===undefined){ f.ax=tdx/td; f.ay=tdy/td; }
      var trk=((f.st>0)?0.10:0.17)*DF.world;
      f.ax+=((tdx/td)-f.ax)*trk; f.ay+=((tdy/td)-f.ay)*trk;
      var anr=Math.sqrt(f.ax*f.ax+f.ay*f.ay)||1; f.ax/=anr; f.ay/=anr;
      if(Math.abs(f.x-px)<(f.t==='ceil'?112:136) && f.x<camX+VW+4 && !player.hidden && !calm){
        if(f.tm>130*DF.rate){ f.st=3; f.tm=0; }
        if(f.st>0 && f.tm%14===0){ f.st--;
          eShot(f.x+f.w/2,f.y+f.h/2,f.x+f.w/2+f.ax*80,f.y+f.h/2+f.ay*80,1.65); SFX.clang(); }
      }
    }
    else if(f.t==='fpv'){
      f.tm++;
      if(f.st===0){                       /* заходить і шукає ціль */
        f.x+=f.vx; f.y=44+Math.sin(f.tm*0.09)*7;
        if(f.x<px+120){
          if(player.hidden){ f.st=2; f.vy=-0.6; SFX.clang(); popup('ВТРАТИВ ЦІЛЬ'); }
          else if(f.tm>50){ f.st=1; f.tm=0;
            var ddx=px-f.x, ddy=py-f.y, dd=Math.sqrt(ddx*ddx+ddy*ddy)||1;
            f.vx=ddx/dd*2.6*DF.world; f.vy=ddy/dd*2.6*DF.world; SFX.laser(); }
        }
      } else if(f.st===1){                /* пікірує */
        if(player.hidden && f.tm<16){ f.st=2; f.vy=-1.2; popup('ВТРАТИВ ЦІЛЬ'); }
        f.vx*=1.03; f.vy*=1.03;
        f.x+=f.vx; f.y+=f.vy;
        if(frame%2===0) parts.push({x:f.x+8,y:f.y+6,vx:0,vy:0,t:0,life:14,c:'#9aa2b4'});
        var gyf=groundYAt(f.x+8);
        if((gyf>-100&&f.y+f.h>gyf)||f.y>VH){   /* влучив у землю */
          boom(f.x+8,f.y+6,16,'#fc9838',3); SFX.boom(); shakeIt(6); hitStop=5;
          if(!player.dead&&!player.inv&&Math.abs((player.x+5)-(f.x+8))<22&&Math.abs(player.y-f.y)<30) killPlayer('fpv');
          foes.splice(i,1); continue;
        }
      } else {                            /* пішов геть */
        f.x+=f.vx*0.8; f.y+=f.vy; f.vy*=0.98;
        if(f.x<camX-60||f.y<-30){ foes.splice(i,1); continue; }
      }
    }
    else if(f.t==='drone'){
      f.tm++;
      var cyc3=Math.round(200*DF.rate), dph=f.tm%cyc3;
      var over=(px-8)-f.x;
      var tvx=Math.max(-1.15,Math.min(1.15,over*0.02))*DF.world;
      if(dph>cyc3-34&&dph<cyc3-8) tvx*=0.25;
      f.vx+=(tvx-f.vx)*0.05;
      f.x+=f.vx;
      var dip=(dph>cyc3-34&&dph<cyc3-4)?Math.sin((dph-(cyc3-34))/30*Math.PI)*5:0;
      var ty2=f.by+Math.sin(f.tm*0.04)*10+dip;
      f.y+=(ty2-f.y)*0.07;
      if(dph===cyc3-6 && Math.abs(over)<46 && eb.length<DF.maxeb && !player.hidden && !calm)
        eb.push({x:f.x+8,y:f.y+10,vx:0,vy:1.3*DF.eb,w:4,h:6,col:'#fcd800',t:0});
    }
    else if(f.t==='bunker'){
      f.tm++;
      if(f.tm>190*DF.rate && Math.abs(f.x-px)<150 && Math.abs(f.x-px)>58 && f.x<camX+VW+10){
        f.tm=0;
        var alive=0; for(var q=0;q<foes.length;q++) if(foes[q].par===f) alive++;
        if(alive<3){ spawnFoe('run',f.x+(px<f.x?-14:16),0); foes[foes.length-1].par=f; f.kick=9; SFX.clang(); }
      }
    }
    if(f.burn>0){
      f.burn--;
      if(f.burn%9===0){ f.hp-=1; f.fl=2;
        if(f.hp<=0){ foeDie(f); foes.splice(i,1); continue; } }
      if(frame%3===0) parts.push({x:f.x+2+Math.random()*(f.w-4),y:f.y+2+Math.random()*(f.h-6),
        vx:(Math.random()-0.5)*0.3,vy:-0.6,t:0,life:14,c:(frame%9<4)?'#fcd800':'#fc5820'});
    }
    if(f.kx){ f.x+=f.kx; f.kx*=0.7; if(Math.abs(f.kx)<0.05) f.kx=0; }
    /* контакт з гравцем */
    if(!player.dead && !player.inv && hit(player.x,player.y,player.w,player.h,f.x,f.y,f.w,f.h)) killPlayer();
  }
}

/* ---------- боси ---------- */
function spawnBoss(){
  if(!lvl.bossType) return;
  bossIntro=100;
  bossOn=true; camLock=true; musStep=0; SFX.boss();
  tone(220,55,0.55,'sawtooth',0.07);
  var bx=lvl.len-VW;
  if(lvl.bossType==='gate'){
    boss={t:'gate',x:bx+176,y:40,w:80,h:lvl.gy-40,hp:1,tm:0,open:0,
      ports:[{x:bx+176,y:76,w:30,h:28,hp:8},{x:bx+176,y:154,w:30,h:30,hp:8}],
      core:{x:bx+176,y:110,w:38,h:38,hp:Math.round(34*DF.boss)},maxhp:Math.round(34*DF.boss)};
  } else if(lvl.bossType==='mech'){
    boss={t:'mech',x:bx+180,y:lvl.gy-48,w:40,h:48,hp:Math.round(62*DF.boss),maxhp:Math.round(62*DF.boss),vy:0,tm:0,dir:-1,land:0,flash:0};
  } else {
    boss={t:'core',cx:bx+206,cy:112,r:22,hp:Math.round(56*DF.boss),maxhp:Math.round(56*DF.boss),tm:0,flash:0,
      pods:[{a:0,hp:8},{a:1.57,hp:8},{a:3.14,hp:8},{a:4.71,hp:8}]};
  }
}
function updBoss(){
  var px=player.x+player.w/2, py=player.y+player.h/2;
  if(boss.calm>0){ boss.calm--; if(boss.flash>0) boss.flash--; if(boss.t==='mech'){ boss.vy+=0.32; boss.y=Math.min(boss.y+boss.vy,lvl.gy-boss.h); if(boss.y>=lvl.gy-boss.h){boss.vy=0;boss.land=1;} } return; }
  boss.tm++;
  if(boss.flash>0) boss.flash--;
  if(boss.t==='gate'){
    var alive=boss.ports.filter(function(p){ return p.hp>0; });
    var cyc=Math.round(145*DF.rate);
    boss.ports.forEach(function(p,pi){
      if(p.hp<=0) return;
      if(boss.tm%cyc===Math.round(pi*cyc/2)){ eShot(p.x+p.w/2,p.y+p.h/2,px,py,1.8); SFX.clang(); }
    });
    if(alive.length===0){
      boss.open=(boss.tm%160<90)?1:0;
      if(boss.open && boss.tm%Math.round(110*DF.rate)===0){ eRadial(boss.core.x+18,boss.core.y+19,6,1.7,boss.tm*0.02); SFX.clang(); }
    } else if(boss.tm%Math.round(205*DF.rate)===0){
      for(var i=-2;i<=2;i++){ var a=Math.atan2(py-(boss.core.y+19),px-(boss.core.x+18))+i*0.22;
        eb.push({x:boss.core.x+18,y:boss.core.y+19,vx:Math.cos(a)*2,vy:Math.sin(a)*2,w:4,h:4,col:'#fc84fc',t:0}); }
    }
    boss.hp=boss.core.hp;
    if(player.x+player.w>boss.x) player.x=boss.x-player.w;
  }
  else if(boss.t==='mech'){
    boss.vy+=0.32; boss.y+=boss.vy;
    var gy=lvl.gy;
    if(boss.y+boss.h>=gy){ if(boss.vy>2){ shakeIt(6); SFX.boom();
        waves.push({x:boss.x,vx:-2.2*DF.world,t:0}); waves.push({x:boss.x+boss.w,vx:2.2*DF.world,t:0}); }
      boss.y=gy-boss.h; boss.vy=0; boss.land=1; }
    if(boss.land){
      var d=(px<boss.x+boss.w/2)?-1:1; boss.dir=d;
      var tsp=(boss.crouch>0)?0:((Math.abs(px-(boss.x+boss.w/2))>58)?0.58*DF.world:0);
      boss.vx=(boss.vx||0)+((d*tsp)-(boss.vx||0))*0.08;
      boss.x+=boss.vx;
      boss.x=Math.max(lvl.len-VW+8,Math.min(lvl.len-boss.w-8,boss.x));
      if(boss.tm%Math.round(210*DF.rate)===0) boss.crouch=26;
      if(boss.crouch>0){ boss.crouch--; if(boss.crouch===0){ boss.vy=-6.9; boss.land=0; } }
      if(boss.tm%Math.round(110*DF.rate)===0){
        for(var k=-1;k<=1;k++){ var an=Math.atan2(py-(boss.y+16),px-(boss.x+boss.w/2))+k*0.25;
          eb.push({x:boss.x+boss.w/2,y:boss.y+16,vx:Math.cos(an)*2.3,vy:Math.sin(an)*2.3,w:4,h:4,col:'#fc5454',t:0}); }
        SFX.clang();
      }
    }
    if(hit(player.x,player.y,player.w,player.h,boss.x,boss.y,boss.w,boss.h) && !player.inv && !player.dead) killPlayer();
  }
  else {
    var live=boss.pods.filter(function(p){ return p.hp>0; });
    var tspd=(0.012+0.0042*(4-live.length))*DF.world;
    boss.spd=(boss.spd||0.012)+(tspd-(boss.spd||0.012))*0.02;
    for(var i=0;i<boss.pods.length;i++){
      var p=boss.pods[i]; if(p.hp<=0) continue;
      p.a+=(boss.spd||0.012);
      p.x=boss.cx+Math.cos(p.a)*58-8+Math.sin(boss.tm*0.06+i)*2;
      p.y=boss.cy+Math.sin(p.a)*58-8+Math.cos(boss.tm*0.05+i*1.7)*2;
      if(boss.tm%Math.round(180*DF.rate)===i*36) eShot(p.x+8,p.y+8,px,py,1.7);
    }
    if(live.length===0){
      boss.cx+=(px-boss.cx)*0.0022*DF.world; if(boss.cx<lvl.len-118) boss.cx=lvl.len-118;
      if(boss.tm%Math.round(118*DF.rate)===0){ eRadial(boss.cx,boss.cy,7,1.55,boss.tm*0.05); SFX.clang(); }
    }
    if(hit(player.x,player.y,player.w,player.h,boss.cx-boss.r,boss.cy-boss.r,boss.r*2,boss.r*2) && !player.inv && !player.dead) killPlayer();
  }
}
function bossHit(b,dmg,x,y){
  /* повертає true якщо влучили в щось */
  if(boss.t==='gate'){
    for(var i=0;i<boss.ports.length;i++){ var p=boss.ports[i];
      if(p.hp>0 && hit(x,y,4,4,p.x,p.y,p.w,p.h)){ p.hp-=dmg; boss.flash=4; SFX.hit(); boom(x,y,3,'#fcfc54');
        shakeIt(0.8);
        if(p.hp<=0){ boom(p.x+p.w/2,p.y+p.h/2,16); SFX.boom(); shakeIt(5); hitStop=7; addScore(1000); } return true; } }
    var c=boss.core;
    if(hit(x,y,4,4,c.x,c.y,c.w,c.h)){
      var op=boss.ports.every(function(p){return p.hp<=0;}) && boss.open;
      if(op){ c.hp-=dmg; boss.flash=4; shakeIt(0.8); SFX.hit(); boom(x,y,3,'#fcfc54'); if(c.hp<=0) bossDead(); }
      else { SFX.clang(); boom(x,y,3,'#9aa2b4'); }
      return true;
    }
    if(hit(x,y,4,4,boss.x,boss.y,boss.w,boss.h)){ SFX.clang(); boom(x,y,2,'#9aa2b4'); return true; }
  }
  else if(boss.t==='mech'){
    if(hit(x,y,4,4,boss.x,boss.y,boss.w,boss.h)){ boss.hp-=dmg; boss.flash=4; shakeIt(0.8); SFX.hit(); boom(x,y,3,'#fcfc54');
      if(boss.hp<=0) bossDead(); return true; }
  }
  else {
    for(var j=0;j<boss.pods.length;j++){ var q=boss.pods[j];
      if(q.hp>0 && hit(x,y,4,4,q.x,q.y,16,16)){ q.hp-=dmg; boss.flash=3; shakeIt(0.8); SFX.hit(); boom(x,y,3,'#fcfc54');
        if(q.hp<=0){ boom(q.x+8,q.y+8,14); SFX.boom(); hitStop=6; addScore(800); } return true; } }
    if(hit(x,y,4,4,boss.cx-boss.r,boss.cy-boss.r,boss.r*2,boss.r*2)){
      if(boss.pods.every(function(p){return p.hp<=0;})){ boss.hp-=dmg; boss.flash=4; SFX.hit(); boom(x,y,3,'#fcfc54');
        if(boss.hp<=0) bossDead(); return true; }
      /* поки живі поди — щит відбиває іскри, але куля летить далі */
      if(frame%7===0) SFX.clang();
      boom(x,y,1,'#9aa2b4'); return false;
    }
  }
  return false;
}
function bossDead(){
  addScore(5000); shakeIt(10); hitStop=10; SFX.boom();
  var bx=(boss.t==='core')?boss.cx:boss.x+boss.w/2, by=(boss.t==='core')?boss.cy:boss.y+boss.h/2;
  for(var i=0;i<28;i++) setTimeout(function(){ boom(bx+(Math.random()*60-30),by+(Math.random()*60-30),8); SFX.boom(); },i*60);
  boss=null; bossOn=false; state='clear'; clearT=0; doSave();
}

/* ---------- гравець ---------- */
function killPlayer(){
  if(player.dead) return;
  player.dead=1; player.deadT=0; player.vy=-3.2; SFX.die(); shakeIt(5); flashT=6;
  boom(player.x+5,player.y+10,14,'#fc5454');
}
function updPlayer(){
  var p=player;
  if(p.cd>0) p.cd--;
  if(p.inv>0) p.inv--;
  if(p.drop>0) p.drop--;
  if(p.dead){
    p.deadT++; p.vy+=0.3; p.y+=p.vy; p.x-=0.6;
    if(p.deadT>60){
      lives--; stageDeaths++; mult=1;
      var mk=stageIx+':'+Math.round(p.x/90);
      mercy[mk]=(mercy[mk]||0)+1;
      if(lives<0){ state='over'; overT=0; return; }
      var s=safeX(camX+20); player=newPlayer(s.x,Math.min(s.y,VH-40));
      var mk2=stageIx+':'+Math.round(s.x/90);
      if((mercy[mk2]||0)>=3 && !bossOn){ mercy[mk2]=0;
        pods.push({x:camX+VW+16,by:lvl.gy-26,y:lvl.gy-30,vx:-0.95,tp:nextWeapon()}); }
      eb.length=0; waves.length=0; calm=80;
      if(bossOn&&boss){ boss.calm=110; }
      for(var fi=foes.length-1;fi>=0;fi--){ if(foes[fi].t!=='fpv'&&Math.abs(foes[fi].x-s.x)<92) foes.splice(fi,1); }
    }
    return;
  }
  p.prone = (p.grounded && IN.d && !IN.l && !IN.r) ? 1 : 0;
  p.h = p.prone?10:20;
  var sp=1.7, want=0;
  if(!p.prone){
    if(IN.l){ want=-sp; p.face=-1; }
    if(IN.r){ want=sp; p.face=1; }
  }
  if(p.vx===undefined) p.vx=0;
  if(p.pivot>0) p.pivot--;
  if(want && p.vx && (want>0)!==(p.vx>0) && Math.abs(p.vx)>0.9) p.pivot=3;
  if(p.pivot>0) p.vx=want*0.3;
  else {
    var rt = want ? 0.75 : (p.grounded?0.42:0.30);
    p.vx += (want-p.vx)*rt;
    if(Math.abs(p.vx)<0.07) p.vx=0;
  }
  if(p.prone){
    if(p.slide===undefined) p.slide=0;
    p.vx=p.slide; p.slide*=0.86; if(Math.abs(p.slide)<0.05) p.slide=0;
  } else p.slide=(Math.abs(p.vx)>1.2)?p.vx*0.75:0;
  if(Math.abs(p.vx)>0.2) p.anim+=Math.abs(p.vx); else p.anim=0;
  /* стрибок: койот-тайм + буфер натискання */
  if(p.grounded) p.coy=7; else if(p.coy>0) p.coy--;
  if(EDGE.jump){ EDGE.jump=0; p.jbuf=9; }
  if(p.jbuf>0) p.jbuf--;
  if(p.jbuf>0 && (p.grounded||p.coy>0)){
    p.jbuf=0;
    if(p.prone && p.onOne){ p.drop=14; p.grounded=0; p.coy=0; }
    else { p.vy=-7.4; p.grounded=0; p.coy=0; p.squash=0; p.stretch=6; SFX.jump();
           for(var dq=0;dq<3;dq++) parts.push({x:p.x+2+dq*3,y:p.y+19,vx:(dq-1)*0.5,vy:0.3,t:0,life:12,c:'#b8b0a0'}); }
  }
  /* вогонь */
  if(IN.fire || (autoFire && !p.inCover)) shoot();
  EDGE.fire=0;
  /* фізика */
  var gv=(Math.abs(p.vy)<1.1)?0.36:(p.vy<0?0.44:0.62);
  p.vy+=gv; if(p.vy>8.5) p.vy=8.5;
  p.x+=p.vx;
  for(var i=0;i<lvl.solids.length;i++){ var s=lvl.solids[i];
    if(hit(p.x,p.y,p.w,p.h,s.x,s.y,s.w,s.h)){
      if(p.vx>0) p.x=s.x-p.w; else if(p.vx<0) p.x=s.x+s.w; } }
  p.py=p.y; var wasG=p.grounded, impact=p.vy; p.y+=p.vy; p.grounded=0; p.onOne=null;
  for(var j=0;j<lvl.solids.length;j++){ var s2=lvl.solids[j];
    if(hit(p.x,p.y,p.w,p.h,s2.x,s2.y,s2.w,s2.h)){
      if(p.vy>0){ p.y=s2.y-p.h; p.vy=0; p.grounded=1; }
      else if(p.vy<0){ p.y=s2.y+s2.h; p.vy=0; } } }
  if(p.vy>=0 && p.drop<=0){
    for(var k=0;k<lvl.oneway.length;k++){ var o=lvl.oneway[k];
      if(p.x+p.w>o.x && p.x<o.x+o.w && p.py+p.h<=o.y+2 && p.y+p.h>=o.y){
        p.y=o.y-p.h; p.vy=0; p.grounded=1; p.onOne=o; } }
  }
  if(p.grounded&&!wasG&&impact>3.2){
    p.squash=Math.min(8,3+impact); p.stretch=0;
    if(impact>5){ SFX.clang(); shakeIt(1.2); }
    for(var dl=0;dl<4;dl++) parts.push({x:p.x+1+dl*3,y:p.y+19,vx:(dl-1.5)*0.7,vy:-0.25,t:0,life:14,c:'#c8c0a8'});
  }
  p.inCover=0;
  for(var cv=0;cv<lvl.cover.length;cv++){ var C2=lvl.cover[cv];
    if(p.x+p.w>C2.x+4 && p.x<C2.x+C2.w-4 && p.y+p.h>C2.y && p.y<C2.y+C2.h+6){
      p.inCover=1; C2.sway=Math.max(C2.sway,10);
    } }
  if(p.loud>0) p.loud--;
  p.hidden=(p.inCover&&p.loud<=0)?1:0;
  if(p.hidden&&!lvl.coverTip){ lvl.coverTip=1; popup('УКРИТТЯ — ТЕБЕ НЕ ВИДНО'); }
  if(p.squash>0) p.squash--;
  if(p.stretch>0) p.stretch--;
  if(p.grounded&&p.vx&&frame%10===0)
    parts.push({x:p.x+4-p.face*3,y:p.y+19,vx:-p.face*0.5,vy:-0.15,t:0,life:11,c:'#b0a894'});
  if(p.x<Math.max(0,camX)) p.x=Math.max(0,camX);
  if(p.x+p.w>lvl.len) p.x=lvl.len-p.w;
  if(p.y>VH+10) killPlayer();
}

/* ---------- кулі, бонуси ---------- */
function updBullets(){
  for(var i=pb.length-1;i>=0;i--){
    var b=pb[i]; b.t++;
    if(b.kind==='F'){ b.wob+=0.3; b.x+=b.vx; b.y+=b.vy+Math.sin(b.wob)*0.3;
      if(b.t%2===0) parts.push({x:b.x,y:b.y,vx:0,vy:-0.25,t:0,life:12,c:(b.t%4)?'#fc9838':'#c84010'}); }
    else { b.x+=b.vx; b.y+=b.vy;
      if(b.kind==='L'&&b.t%2===0) trails.push({x:b.x,y:b.y,w:b.w,h:b.h,t:0}); }
    if(b.y>lvl.gy+2 && groundYAt(b.x)<-100){ splash(b.x,lvl.gy+4); pb.splice(i,1); continue; }
    if(b.x<camX-24||b.x>camX+VW+24||b.y<-16||b.y>VH+16){ pb.splice(i,1); continue; }
    var blocked=0;
    for(var sq=0;sq<lvl.solids.length;sq++){ var sv=lvl.solids[sq];
      if(b.x+b.w>sv.x&&b.x<sv.x+sv.w&&b.y+b.h>sv.y&&b.y<sv.y+sv.h){
        if(sv.crate){
          sv.hp-=b.dmg; sv.fl=4; SFX.hit(); boom(b.x,b.y,2,'#c8a060',1);
          if(sv.hp<=0){
            boom(sv.x+sv.w/2,sv.y+sv.h/2,12,'#c8a060',2.4); SFX.boom(); shakeIt(3); addScore(150);
            if(Math.random()<0.4) items.push({x:sv.x+sv.w/2-5,y:sv.y+4,vy:-1.4,tp:nextWeapon(),t:0});
            lvl.solids.splice(sq,1);
          }
        } else { boom(b.x,b.y,2,'#c8ccd8',1); SFX.clang(); }
        blocked=1; break;
      } }
    if(blocked){ pb.splice(i,1); continue; }
    var gone=false;
    for(var f=foes.length-1;f>=0;f--){ var e=foes[f];
      if(hit(b.x,b.y,b.w,b.h,e.x,e.y,e.w,e.h)){
        e.hp-=b.dmg; e.fl=4; hits++; SFX.hit(); boom(b.x,b.y,2,'#fcfc54');
        if(b.kind==='F'){ e.burn=Math.max(e.burn||0,54); }
        if(b.kind!=='L'&&b.kind!=='F'){ e.kx=(e.kx||0)+(b.vx>0?0.5:-0.5); }
        if(e.hp<=0){ foeDie(e,b.x,b.y); foes.splice(f,1); }
        if(!b.pierce){ pb.splice(i,1); gone=true; }
        break; } }
    if(gone) continue;
    for(var q=pods.length-1;q>=0;q--){ var pd=pods[q];
      if(hit(b.x,b.y,b.w,b.h,pd.x,pd.y,18,12)){
        boom(pd.x+9,pd.y+6,10,'#54fcfc'); SFX.boom();
        items.push({x:pd.x+4,y:pd.y,vy:0,tp:pd.tp,t:0});
        pods.splice(q,1); if(!b.pierce){ pb.splice(i,1); gone=true; } break; } }
    if(gone) continue;
    if(bossOn && boss){ if(bossHit(boss,b.dmg,b.x,b.y) && !b.pierce) pb.splice(i,1); }
  }
  for(var m=eb.length-1;m>=0;m--){
    var v=eb[m]; v.t++; v.x+=v.vx; v.y+=v.vy;
    if(v.y>lvl.gy+2 && groundYAt(v.x)<-100){ splash(v.x,lvl.gy+4); eb.splice(m,1); continue; }
    if(v.x<camX-30||v.x>camX+VW+30||v.y<-20||v.y>VH+20){ eb.splice(m,1); continue; }
    var st=0;
    for(var sq=0;sq<lvl.solids.length;sq++){ var sv=lvl.solids[sq];
      if(v.x+v.w>sv.x&&v.x<sv.x+sv.w&&v.y+v.h>sv.y&&v.y<sv.y+sv.h){ st=1; break; } }
    if(st){ boom(v.x,v.y,2,'#8c94a8',1); eb.splice(m,1); continue; }
    if(!player.dead && !player.inv && hit(v.x,v.y,v.w,v.h,player.x+1,player.y+1,player.w-2,player.h-2)){
      eb.splice(m,1); killPlayer(); }
  }
  for(var w=waves.length-1;w>=0;w--){
    var wv=waves[w]; wv.x+=wv.vx; wv.t++;
    if(wv.t>150){ waves.splice(w,1); continue; }
    if(!player.dead && !player.inv && player.grounded &&
       Math.abs((player.x+5)-wv.x)<8) killPlayer();
  }
  for(var it=items.length-1;it>=0;it--){
    var I=items[it]; I.t++; I.vy+=0.2; I.y+=I.vy;
    var gy=groundYAt(I.x); if(gy>-100 && I.y+10>gy){ I.y=gy-10; I.vy=0; }
    for(var o2=0;o2<lvl.oneway.length;o2++){ var oo=lvl.oneway[o2];
      if(I.x+10>oo.x&&I.x<oo.x+oo.w&&I.y+10>oo.y&&I.y+10<oo.y+10&&I.vy>0){ I.y=oo.y-10; I.vy=0; } }
    if(I.t>620){ items.splice(it,1); continue; }
    if(!player.dead && hit(I.x,I.y,10,10,player.x,player.y,player.w,player.h)){
      weapon=I.tp; SFX.pick(); popup(WP[I.tp].n); addScore(300); items.splice(it,1); }
  }
  for(var cp=corpses.length-1;cp>=0;cp--){
    var C=corpses[cp]; C.t++; C.vy+=0.34; C.x+=C.vx; C.y+=C.vy; C.vx*=0.94;
    var gyc=groundYAt(C.x+5);
    if(gyc>-100 && C.y+16>gyc){ C.y=gyc-16; C.vy=0; C.vx*=0.6; }
    if(C.t>70) corpses.splice(cp,1);
  }
  for(var tr=trails.length-1;tr>=0;tr--){ trails[tr].t++; if(trails[tr].t>10) trails.splice(tr,1); }
  for(var ex=explo.length-1;ex>=0;ex--){ var E=explo[ex]; E.t++; if(E.t>16) explo.splice(ex,1); }
  if(flashT>0) flashT--;
  if(player.mz>0) player.mz--;
  for(var pt=parts.length-1;pt>=0;pt--){
    var P=parts[pt]; P.t++; P.vy+=0.12; P.x+=P.vx; P.y+=P.vy;
    if(P.t>P.life) parts.splice(pt,1);
  }
  for(var pp=pods.length-1;pp>=0;pp--){
    var PD=pods[pp]; PD.x+=PD.vx; PD.y=PD.by+Math.sin(PD.x*0.03)*10;
    if(PD.x<camX-40||PD.x>camX+VW+80) pods.splice(pp,1);
  }
}

/* ---------- крок гри ---------- */
function step(){
  if(bossIntro>0 && state==='play'){ bossIntro--; frame++; return; }
  if(hitStop>0 && state==='play'){ hitStop--; return; }
  stepInner(); EDGE.jump=0; EDGE.u=0; EDGE.d=0; EDGE.fire=0;
}
function stepInner(){
  frame++;
  if(shake>0){ shake*=0.86; if(shake<0.3) shake=0;
    shX=(Math.random()*2-1)*shake*S; shY=(Math.random()*2-1)*shake*S; } else { shX=0; shY=0; }
  if(msgT>0) msgT--;

  if(state==='menu'){ menuStep(); return; }
  if(state==='help'){ if(EDGE.fire||EDGE.jump){ EDGE.fire=0;EDGE.jump=0; state='menu'; } return; }
  if(state==='intro'){
    introT++;
    if(introT>150||EDGE.fire){ EDGE.fire=0; state='play'; }
    return;
  }
  if(state==='pause'){ pauseStep(); return; }
  if(state==='clear'){
    if(clearT===0){
      var st0=stageStats(); rankNow=st0.r;
      var key='s'+stageIx+'d'+diffIx;
      if(!bestT[key]||st0.t<bestT[key]){ bestT[key]=Math.round(st0.t*10)/10;
        try{ localStorage.setItem('sr8_bt',JSON.stringify(bestT)); }catch(e){} }
      lastStats=st0;
      if(lives<DF.lives+2){ lives++; }
      if(st0.d===0 && mult<5){ mult++; popup('МНОЖНИК \u00d7'+mult); }
    }
    clearT++;
    if(clearT>200){
      if(rush){
        var ri=RUSH.indexOf(stageIx);
        if(ri>=0&&ri<RUSH.length-1) startStage(RUSH[ri+1],true);
        else { state='win'; overT=0; winHero=190; doSave(); }
      }
      else if(stageIx>=STAGES.length-1){ state='win'; overT=0; winHero=190; wonOnce=1; doSave(); }
      else { startStage(stageIx+1,true); }
    }
    return;
  }
  if(state==='over'){
    overT++;
    if(overT>50 && EDGE.fire){ EDGE.fire=0; lives=DF.lives; score=stageScore; startStage(stageIx,false); }
    if(overT>50 && EDGE.jump){ EDGE.jump=0; state='menu'; menuIx=0; loadSave(); buildMenu(); }
    return;
  }
  if(state==='win'){
    overT++;
    if(overT<150){
      if(overT%9===0){ boom(camX+30+Math.random()*(VW-60),60+Math.random()*(lvl.gy-70),12,'#fc9838',2.6);
        SFX.boom(); shakeIt(4); }
      if(winHero>0){ winHero-=1.1; }
    }
    if(overT>60 && (EDGE.fire||EDGE.jump)){ EDGE.fire=0; EDGE.jump=0; state='menu'; menuIx=0; loadSave(); buildMenu(); }
    return;
  }

  /* --- гра --- */
  if(calm>0) calm--;
  if(fpvWarn>0){
    fpvWarn--;
    if(fpvWarn%24===0 && fpvWarn>0) tone(880,1320,0.12,'square',0.04);
    if(fpvWarn===0 && fpvPend>0){ fpvPend--; spawnFPV(); }
  }
  if(frame%8===0) music(lvl.mus);
  updPlayer();
  if(state!=='play') return;
  updFoes();
  if(bossOn && boss) updBoss();
  updBullets();

  /* камера */
  if(lvl.auto && !camLock && !player.dead){
    camX+=lvl.auto;
    if(camX>lvl.len-VW) camX=lvl.len-VW;
    if(player.x<camX+3) player.x=camX+3;
    if(player.x+player.w>camX+VW-3) player.x=camX+VW-3-player.w;
  } else if(!camLock){
    var lead=(player.dead?0:player.face*22);
    camLead+=(lead-camLead)*0.045;
    var want=player.x-100+camLead;
    var dcam=want-camX;
    camX+=dcam*0.16;
    if(Math.abs(dcam)<0.35) camX=want;
    if(camX<0) camX=0;
    if(camX>lvl.len-VW){ camX=lvl.len-VW; }
  } else camX+=(lvl.len-VW-camX)*0.12;
  if(!bossOn){
    if(lvl.bossType){ if(camX>=lvl.len-VW-1) spawnBoss(); }
    else if(player.x>lvl.len-46 && !player.dead){ state='clear'; clearT=0; }
  }

  /* поява ворогів */
  for(var i=0;i<lvl.spawns.length;i++){ var s=lvl.spawns[i];
    if(!s.done && s.x<camX+VW+30){ s.done=1; spawnFoe(s.t,s.x,s.y); } }
  while(lvl.fpvX.length && player.x>lvl.fpvX[0] && !bossOn){
    lvl.fpvX.shift(); fpvWarn=120; fpvPend++;
    tone(880,1320,0.16,'square',0.05);
  }
  for(var j=0;j<lvl.pods.length;j++){ var pd=lvl.pods[j];
    if(!pd.done && pd.x<camX+VW-20){ pd.done=1;
      var tp=nextWeapon();
      pods.push({x:camX+VW+16,by:lvl.gy-26-((Math.random()*10)|0),y:lvl.gy-30,vx:-0.95,tp:tp});
      tone(660,990,0.1,'square',0.035); } }
}

/* ---------- меню ---------- */
var MENU=[];
function buildMenu(){
  MENU=[{k:'new',t:'НОВА ГРА'}];
  if(saved && saved.stage>0) MENU.splice(0,0,{k:'cont',t:'ПРОДОВЖИТИ — ЕТАП '+(saved.stage+1)});
  if(wonOnce) MENU.push({k:'rush',t:'BOSS RUSH — три боси поспіль'});
  MENU.push({k:'diff',t:'СКЛАДНІСТЬ: '+DIFFS[diffIx].n});
  MENU.push({k:'help',t:'ЯК ГРАТИ'});
}
buildMenu();
function menuStep(){
  if(EDGE.u){ EDGE.u=0; menuIx=(menuIx+MENU.length-1)%MENU.length; SFX.clang(); }
  if(EDGE.d){ EDGE.d=0; menuIx=(menuIx+1)%MENU.length; SFX.clang(); }
  if(EDGE.fire||EDGE.jump){
    EDGE.fire=0; EDGE.jump=0; actx();
    var m=MENU[menuIx];
    if(m.k==='new'){ resetGame(0); }
    else if(m.k==='cont'){ DF=DIFFS[diffIx]; lives=DF.lives; score=saved.score||0; stageScore=score; startStage(saved.stage,false); }
    else if(m.k==='rush'){ rush=1; DF=DIFFS[diffIx]; lives=DF.lives; score=0; stageScore=0; startStage(RUSH[0],false); }
    else if(m.k==='diff'){ diffIx=(diffIx+1)%DIFFS.length; DF=DIFFS[diffIx]; buildMenu(); }
    else state='help';
    SFX.pick();
  }
}
var pauseIx=0;
function PROWS(){ return [
  {k:'go',t:'ПРОДОВЖИТИ'},
  {k:'auto',t:'АВТОВОГОНЬ: '+(autoFire?'УВІМК':'ВИМК')},
  {k:'snd',t:'ЗВУК: '+(sndOn?'УВІМК':'ВИМК')},
  {k:'crt',t:'ЕФЕКТ CRT: '+(crtOn?'УВІМК':'ВИМК')},
  {k:'menu',t:'У ГОЛОВНЕ МЕНЮ'}]; }
function pauseStep(){
  var R2=PROWS();
  if(EDGE.u){ EDGE.u=0; pauseIx=(pauseIx+R2.length-1)%R2.length; SFX.clang(); }
  if(EDGE.d){ EDGE.d=0; pauseIx=(pauseIx+1)%R2.length; SFX.clang(); }
  if(EDGE.fire||EDGE.jump){ EDGE.fire=0; EDGE.jump=0; pausePick(R2[pauseIx].k); }
}
function pausePick(k){
  SFX.pick();
  if(k==='go') state='play';
  else if(k==='auto') autoFire=!autoFire;
  else if(k==='snd'){ sndOn=!sndOn; if(sndOn) actx(); }
  else if(k==='crt') crtOn=!crtOn;
  else if(k==='menu'){ state='menu'; menuIx=0; loadSave(); buildMenu(); clearIn(); }
}
function togglePause(){
  if(state==='play'){ state='pause'; clearIn(); }
  else if(state==='pause') state='play';
}

/* ---------- малювання світу ---------- */
function hsh(n){ n=(n<<13)^n; return (((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff); }
function RA(x,y,w,h,c,a){ g.globalAlpha=a; R(x,y,w,h,c); g.globalAlpha=1; }
function circ(cx,cy,r,c){ cx=Math.round(cx); cy=Math.round(cy);
  for(var y=-r;y<=r;y++){ var w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y))); if(w>0) R(cx-w,cy+y,w*2,1,c); } }
function ringD(cx,cy,r,th,c,seg,off){ seg=seg||36; off=off||0;
  for(var a=0;a<seg;a++){ var an=off+a*Math.PI*2/seg;
    R(cx+Math.cos(an)*r-th/2,cy+Math.sin(an)*r-th/2,th,th,c); } }

/* --- шар 1: небо --- */
function drawSky(){

    panel(0.7);
    var S1=lastStats||{t:0,acc:0,d:0,r:'C'};
    txtSh('ЕТАП ПРОЙДЕНО',w/2,h*0.22,28,'#8ee06a','center');
    var rows=[['ЧАС',S1.t.toFixed(1)+' с'],
              ['ВЛУЧНІСТЬ',Math.round(S1.acc*100)+'%'],
              ['СМЕРТІ',String(S1.d)],
              ['ОЧКИ',String(score)+(mult>1?'  \u00d7'+mult:'')]];
    for(var r=0;r<rows.length;r++){
      var ry=h*0.34+r*30;
      txt(rows[r][0],w*0.30,ry,16,'#8496b0');
      txt(rows[r][1],w*0.70,ry,16,'#ffffff','right');
    }
    var bk='s'+stageIx+'d'+diffIx, bt=bestT[bk];
    if(bt!==undefined) txt('рекорд етапу '+bt.toFixed(1)+' с',w/2,h*0.60,13,'#5d6a83','center');
    var rc={'S':'#fcd800','A':'#8ee06a','B':'#7cc0f0','C':'#8496b0'}[S1.r];
    var sz=Math.min(1,(clearT-30)/24);
    if(clearT>30){
      g.globalAlpha=Math.min(1,sz);
      txtSh('РАНГ',w/2-52,h*0.76,18,'#8496b0','center');
      txtSh(S1.r,w/2+34,h*0.785,54+ (1-sz)*40,rc,'center');
      g.globalAlpha=1;
    }
    var bar=Math.min(1,clearT/200);
    g.fillStyle='#1c2740'; g.fillRect(w*0.3,h*0.90,w*0.4,5);
    g.fillStyle=rc; g.fillRect(w*0.3,h*0.90,w*0.4*bar,5);
  }
  if(state==='over'){
    panel(0.85);
    txtSh('ГРУ ЗАВЕРШЕНО',w/2,h*0.36,32,'#fc3800','center');
    txt('ОЧКИ '+score+'   ·   РЕКОРД '+best,w/2,h*0.45,16,'#c3cee0','center');
    if(overT>50){
      txt('ВОГОНЬ — ще раз з етапу '+(stageIx+1),w/2,h*0.58,17,'#fcd800','center');
      txt('СТРИБОК — у головне меню',w/2,h*0.65,15,'#7f8ea8','center');
    }
  }
  if(state==='win'){
    if(overT<150){
      TU(); g.fillStyle='rgba(252,152,56,'+(0.06+Math.random()*0.06)+')'; g.fillRect(0,0,w,h);
      if(overT>40) txtSh('БАЗУ ЗНИЩЕНО',w/2,h*0.2,32,'#fcd800','center');
    } else {
      panel(0.88);
      txtSh('РЕЙД ЗАВЕРШЕНО',w/2,h*0.24,30,'#fcd800','center');
      txt(rush?'BOSS RUSH пройдено':'Три етапи позаду.',w/2,h*0.33,16,'#c3cee0','center');
      txt('ОЧКИ '+score,w/2,h*0.44,22,'#ffffff','center');
      txt('РЕКОРД '+best,w/2,h*0.52,16,'#8496b0','center');
      if(!rush) txt('BOSS RUSH відкрито в меню',w/2,h*0.62,15,'#8ee06a','center');
      if(overT>190 && Math.floor(frame/18)%2) txt('ВОГОНЬ — у меню',w/2,h*0.74,15,'#7f8ea8','center');
    }
  }
  crt();
}
function render(){
  TU(); g.fillStyle='#000'; g.fillRect(0,0,VW*S,VH*S);
  if(state==='menu'){ drawMenu(); return; }
  if(state==='help'){ drawHelp(); return; }
  if(state==='intro'){ drawIntro(); return; }
  TW(); drawWorld();
  drawHUD();
  if(bossIntro>0&&state==='play'){
    TU(); var hb=VH*S, wb=VW*S;
    g.fillStyle='rgba(6,8,14,'+(0.55*Math.min(1,bossIntro/20))+')'; g.fillRect(0,hb*0.30,wb,96);
    g.fillStyle='#fc3800'; g.fillRect(0,hb*0.30,wb,3); g.fillRect(0,hb*0.30+93,wb,3);
    txt('ПРОТИВНИК',wb/2,hb*0.30+34,15,'#ff9c9c','center');
    txtSh(boss&&boss.t==='gate'?'БРАМА':(boss&&boss.t==='mech'?'МЕХ-КОМАНДИР':'ЯДРО РЕАКТОРА'),
          wb/2,hb*0.30+74,30,'#fcd800','center');
  }
  if(state==='play'){ crt(); return; }
  drawOverlay();
}

/* ---------- цикл ---------- */
var last=0, acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last) last=t;
  var dt=t-last; last=t; if(dt>120) dt=120; acc+=dt;
  var n=0;
  while(acc>=16.667 && n<4){ step(); acc-=16.667; n++; }
  if(acc>16.667) acc=0;
  render();
}
loadSave(); buildMenu();
DF=DIFFS[diffIx]; lives=DF.lives; titleT=210;
startStage(0,false);
requestAnimationFrame(loop);

/* автопауза при згортанні */
document.addEventListener('visibilitychange',function(){ if(document.hidden && state==='play'){ state='pause'; clearIn(); } });
})();
</script>

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
